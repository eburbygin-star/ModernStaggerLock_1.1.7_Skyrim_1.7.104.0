name: Build ModernStaggerLock

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Ninja
      run: choco install ninja

    - name: Install vcpkg dependencies
      run: |
        cd $env:USERPROFILE
        vcpkg install spdlog directxtk directxmath nlohmann-json tomlplusplus xbyak simpleini --triplet x64-windows-static-md
      shell: pwsh

    - name: Clone CommonLibSSE-NG
      run: |
        git clone https://github.com/alandtse/CommonLibSSE-NG.git CommonLibSSE-NG
        cd CommonLibSSE-NG
        git checkout 1504349dddfc622d4d25704bba19e2ade669dc5a

    - name: Clone DKUtil
      run: |
        git clone https://github.com/doodlum/DKUtil.git DKUtil
        cd DKUtil
        git checkout 9ffa84252269e0f41b16715b5b9a7a9686c8fc40

    - name: Patch CMakeLists.txt for Ninja
      run: |
        (Get-Content CMakeLists.txt -Raw) -replace '\$\(ConfigurationName\)', '$<CONFIG>' | Set-Content CMakeLists.txt -NoNewline
      shell: pwsh

    - name: Patch DKUtil for PSAPI
      run: |
        $file = "DKUtil/include/DKUtil/Impl/Hook/Shared.hpp"
        if (Test-Path $file) {
          $content = Get-Content $file -Raw
          if ($content -notmatch 'psapi\.h') {
            $content = "#include <psapi.h>`n#define PSAPI_VERSION 1`n" + $content
          }
          $content | Set-Content $file -NoNewline
        }
      shell: pwsh

    - name: Configure CMake
      env:
        VCPKG_ROOT: C:/vcpkg
        CommonLibSSEPath: ${{ github.workspace }}/CommonLibSSE-NG
        DKUtilPath: ${{ github.workspace }}/DKUtil
        HEADLESS: 1
      run: |
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_MANIFEST_MODE=OFF -DBUILD_TESTS=OFF -DSKSE_SUPPORT_XBYAK=ON

    - name: Build
      run: cmake --build build

    - name: Find DLL
      run: |
        dir build
        if (Test-Path "build/Release") { dir build/Release }
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernStaggerLock-DLL
        path: |
          build/ModernStaggerLock.dll
          build/Release/ModernStaggerLock.dll
        if-no-files-found: warn
